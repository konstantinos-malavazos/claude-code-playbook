# excluded_tools is all_tools minus the edit list in profiles.json; RC8b checks it.
description: "Playbook route C, edit profile - one repo, lookups plus the playbook's symbol edit tools."
prompt: |
  This Serena server serves one repository, already active. There is no
  activate_project. It offers only the edit tools of the playbook's route C.
excluded_tools:
  - activate_project
  - delete_lines
  - delete_memory
  - edit_memory
  - execute_shell_command
  - get_current_config
  - get_diagnostics_for_symbol
  - initial_instructions
  - insert_at_line
  - jet_brains_debug
  - jet_brains_find_declaration
  - jet_brains_find_implementations
  - jet_brains_find_referencing_symbols
  - jet_brains_find_symbol
  - jet_brains_get_symbols_overview
  - jet_brains_inline_symbol
  - jet_brains_list_inspections
  - jet_brains_move
  - jet_brains_rename
  - jet_brains_run_inspections
  - jet_brains_safe_delete
  - jet_brains_type_hierarchy
  - list_memories
  - list_queryable_projects
  - onboarding
  - open_dashboard
  - query_project
  - read_memory
  - remove_project
  - rename_memory
  - replace_in_files
  - replace_lines
  - restart_language_server
  - serena_info
  - serena_repl
  - write_memory
tool_description_overrides: {}
single_project: true
structured_tool_output: false
